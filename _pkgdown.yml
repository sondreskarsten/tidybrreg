url: https://sondreskarsten.github.io/tidybrreg/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/tidybrreg.html
      - text: Norwegian business data
        href: articles/business-data.html

reference:
- title: Entity lookup
  desc: >
    Retrieve details for specific entities by organization number.
    See `vignette("tidybrreg")` for a complete walkthrough.
  contents:
  - brreg_entity
  - brreg_underenheter
  - brreg_children
  - brreg_validate

- title: Search
  desc: >
    Query the register by name, legal form, industry, geography,
    and other criteria. Supports both main entities and sub-entities.
  contents:
  - brreg_search

- title: Roles, groups and signing authority
  desc: >
    Board members, officers, auditors, reverse role lookups, the
    corporate group tree, and signature and procuration authority.
  contents:
  - brreg_roles
  - brreg_roles_legal
  - brreg_konsern
  - brreg_signatur
  - brreg_prokura

- title: Incremental updates (CDC)
  desc: >
    Fetch change events from the brreg API's change data capture
    streams for enheter, underenheter, and roller.
  contents:
  - brreg_updates
  - brreg_update_fields

- title: Bulk download
  desc: >
    Download the full register as CSV or JSON. Three registries:
    enheter, underenheter, roller.
  contents:
  - brreg_download

- title: Labels and dictionaries
  desc: >
    Translate Norwegian codes to English or Norwegian descriptions.
    Follows the eurostat package's `type = "label"` pattern.
  contents:
  - brreg_label
  - get_brreg_dic

- title: Reference data and conditions
  desc: >
    Bundled datasets, their provenance, and the condition classes the
    package signals.
  contents:
  - field_dict
  - legal_forms
  - role_types
  - role_groups
  - tidybrreg_provenance
  - tidybrreg_conditions
  - tidybrreg_endpoints
