name: brreg API monitor

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update the committed baseline and open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SCHEMA_OUT: /tmp/tidybrreg_schema_current.tsv

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("httr2","jsonlite","xml2","rvest","dplyr","tibble","readr","purrr","rlang"))'
          python3 -m pip install --quiet requests

      - name: Compute sampling window start
        id: since
        run: |
          f=data-raw/api_monitor/state/periods.tsv
          if [ -s "$f" ]; then
            since=$(awk -F'\t' 'NR>1{print $5}' "$f" | sort | tail -1)
          else
            prev_ver=$(grep -E '^# tidybrreg' NEWS.md | sed -n 2p | awk '{print $3}')
            since=$(git log -S"Version: ${prev_ver}" --reverse --format='%aI' -- DESCRIPTION | head -1)
            [ -z "$since" ] && since=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ)
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Extract observed schema (oppdateringer since last release)
        run: python3 data-raw/api_monitor/schema_probe.py --out "$SCHEMA_OUT" --since "${{ steps.since.outputs.since }}"

      - name: Run monitor and update baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
        run: Rscript data-raw/api_monitor/run.R "$SCHEMA_OUT" --update

      - name: Open PR with updated baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(api-monitor): update brreg API baseline'
          title: 'brreg API baseline update'
          body-path: data-raw/api_monitor/last_report.md
          branch: api-monitor/baseline-update
          add-paths: |
            data-raw/api_monitor/state/

      - name: Run monitor and detect drift
        id: monitor
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baseline) }}
        continue-on-error: true
        run: Rscript data-raw/api_monitor/run.R "$SCHEMA_OUT"

      - name: Upload report
        if: ${{ steps.monitor.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-monitor-report
          path: |
            data-raw/api_monitor/last_report.md
            data-raw/api_monitor/news_snippet.md

      # One canonical open issue carries the drift report. A run that finds
      # drift updates that issue's body (and comments with the run link)
      # instead of opening a new one; a run that finds no drift leaves it
      # alone so the maintainer closes it after accepting the baseline.
      - name: Find the canonical drift issue
        id: canonical
        if: ${{ steps.monitor.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label api-monitor --state open \
                --search 'brreg API drift detected in:title' --json number --jq 'map(.number) | min // empty')
          echo "number=${n}" >> "$GITHUB_OUTPUT"

      - name: Prepend the comparison baseline to the report
        if: ${{ steps.monitor.outcome == 'failure' }}
        run: |
          {
            echo "Baseline: \`data-raw/api_monitor/state/\` as of $(git log -1 --format='%cs (%h)' -- data-raw/api_monitor/state)"
            echo "Sampling window since: ${{ steps.since.outputs.since }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat data-raw/api_monitor/last_report.md
          } > /tmp/drift_issue.md

      - name: Open the canonical drift issue
        if: ${{ steps.monitor.outcome == 'failure' && steps.canonical.outputs.number == '' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'brreg API drift detected'
          content-filepath: /tmp/drift_issue.md
          labels: api-monitor

      - name: Update the canonical drift issue
        if: ${{ steps.monitor.outcome == 'failure' && steps.canonical.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.canonical.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/drift_issue.md
          gh issue comment "${{ steps.canonical.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Drift still present on $(date -u +%Y-%m-%d); report refreshed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
