name: Live API Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '43 7 * * 3'    # Weekly Wednesday 07:43 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false

permissions:
  contents: read

concurrency:
  group: live-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      TIDYBRREG_LIVE_API: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload, any::xml2
          needs: check

      - name: Record what is under test
        run: |
          Rscript -e '
            cat("commit:", Sys.getenv("GITHUB_SHA"), "\n")
            cat("tidybrreg:", as.character(read.dcf("DESCRIPTION", "Version")), "\n")
            cat("R:", R.version.string, "\n")
            cat("fixture timestamp:", format(file.mtime("tests/testthat/fixtures/mock/entity_923609016.json"), tz = "UTC", usetz = TRUE), "\n")
            print(Sys.time())'
        shell: bash

      # The source tests call unexported helpers and local_mocked_bindings(),
      # so they run against the source package loaded with pkgload, not an
      # attached installed copy. In live mode (TIDYBRREG_LIVE_API=true) an
      # unreachable BRREG or SSB endpoint is a failure, not a skip.
      - name: Run the suite against the live register
        run: |
          Rscript -e '
            res <- testthat::test_local(".", load_package = "source",
                                        reporter = testthat::MultiReporter$new(list(
                                          testthat::ProgressReporter$new(),
                                          testthat::JunitReporter$new(file = "junit.xml"))),
                                        stop_on_failure = FALSE)
            df <- as.data.frame(res)
            cat("\n=== Summary ===\n")
            cat("Pass:", sum(df$passed), "\n")
            cat("Fail:", sum(df$failed), "\n")
            cat("Skip:", sum(df$skipped), "\n")
            cat("Warn:", sum(df$warning), "\n")
            if (sum(df$failed) > 0 || sum(df$error) > 0) quit(status = 1)' 2>&1 | tee live-tests.log
        shell: bash

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-api-test-results
          path: |
            live-tests.log
            junit.xml
