# Builds the tidybrreg MCP server image from the same commit as tidybrreg
# and deploys it to Cloud Run. Runs on every push to main that touches the
# core package or the server, so the MCP is updated in tandem with
# tidybrreg: the image installs the core from this checkout, never from
# a registry, and refuses to build if the tool catalogue and the export
# list disagree.
name: MCP image

on:
  push:
    branches: [main]
    paths:
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'R/**'
      - 'man/**'
      - 'data/**'
      - 'inst/**'
      - 'tidybrregmcp/**'
      - '.github/workflows/mcp-image.yaml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloud Run after building'
        type: boolean
        default: true

env:
  GCP_PROJECT: sondreskarsten-d7d14
  GCP_REGION: europe-north1
  IMAGE: europe-north1-docker.pkg.dev/sondreskarsten-d7d14/r-images/tidybrreg-mcp
  GHCR_IMAGE: ghcr.io/sondreskarsten/tidybrreg-mcp

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the tidybrreg version
        id: meta
        run: |
          v=$(awk -F': ' '/^Version:/{print $2}' DESCRIPTION)
          mv=$(awk -F': ' '/^Version:/{print $2}' tidybrregmcp/DESCRIPTION)
          if [ "$v" != "$mv" ]; then echo "tidybrreg $v and tidybrregmcp $mv differ" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tidybrregmcp/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | docker run -i --rm ${{ env.IMAGE }}:${{ github.sha }} > out.jsonl
          n=$(tail -n1 out.jsonl | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["result"]["tools"]))')
          echo "tools: $n"
          test "$n" -eq 15

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          sed "s/IMAGE_TAG/${{ github.sha }}/" tidybrregmcp/deploy/cloud-run.yaml > service.yaml
          gcloud run services replace service.yaml \
            --region "$GCP_REGION" --project "$GCP_PROJECT"
          url=$(gcloud run services describe tidybrreg-mcp --region "$GCP_REGION" \
                --project "$GCP_PROJECT" --format 'value(status.url)')
          curl -fsS "$url/health"
